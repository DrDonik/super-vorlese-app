<!doctype html>
<!-- lang="de" ist nur der Wert, bevor JavaScript läuft: src/i18n.js setzt
     ihn beim Start auf die Sprache, die die App tatsächlich spricht. -->
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#111111" />
    <title>Super Vorlese-App</title>
  </head>
  <body>
    <!-- tabindex="-1" nur, damit mount() den Fokus beim Ansichtswechsel hier
         parken kann; der Container bleibt aus der Tab-Reihenfolge heraus. -->
    <div id="app" tabindex="-1"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
