name: Gemini Re-review

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  request-review:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Request Gemini re-review
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GEMINI_TRIGGER_PAT }}
          script: |
            const prs = context.payload.workflow_run.pull_requests;
            if (!prs || prs.length === 0) {
              console.log('No associated pull requests found, skipping.');
              return;
            }
            for (const pr of prs) {
              // Fetch current PR state to skip merged/closed PRs
              const { data: prData } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number
              });
              if (prData.state !== 'open') {
                console.log(`PR #${pr.number} is ${prData.state}, skipping.`);
                continue;
              }

              // Skip if a review request was already posted in the last 5 minutes
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                per_page: 10,
                direction: 'desc'
              });
              const fiveMinAgo = Date.now() - 5 * 60 * 1000;
              const recentTrigger = comments.find(c =>
                c.body.includes('@gemini-code-assist review') &&
                new Date(c.created_at).getTime() > fiveMinAgo
              );
              if (recentTrigger) {
                console.log(`PR #${pr.number} already has a recent review request, skipping.`);
                continue;
              }

              console.log(`Requesting Gemini review on PR #${pr.number}`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: '@gemini-code-assist review'
              });
            }
